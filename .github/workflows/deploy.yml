name: Deploy site (GitHub Pages)

# Publishes the static site to GitHub Pages on every push (including the
# automated content commits). Enable once in: Settings → Pages → Build and
# deployment → Source = "GitHub Actions".
#
# Note: by default GitHub only allows Pages deployments from the DEFAULT branch.
# Either make this branch the default, or merge to the default branch, for
# deployments to succeed.

on:
  push:
    branches: ["claude/compassionate-lovelace-1hvb6u"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
